<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Kotak Bergerak - Neon Trigger</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain; /* Memastikan game tidak terpotong di HP */
        }

        /* --- VIRTUAL GAMEPAD OVERLAY --- */
        #virtual-gamepad {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .touch-btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(30, 30, 45, 0.45);
            border: 2px solid rgba(0, 210, 211, 0.6);
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .touch-btn:active, .touch-btn.pressed {
            background: rgba(0, 210, 211, 0.7);
            border-color: #00ffff;
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        /* D-PAD LAYOUT (Disesuaikan untuk layar sentuh HP) */
        .dpad-cross {
            position: absolute;
            left: 15px;
            bottom: 15px;
            width: 130px;
            height: 130px;
            pointer-events: none;
        }
        .dpad-btn { 
            width: 42px; 
            height: 42px; 
            font-size: 16px; 
            border-radius: 10px;
            background: rgba(20, 20, 35, 0.65);
        }
        #btn-up    { top: 0px; left: 44px; }
        #btn-down  { bottom: 0px; left: 44px; }
        #btn-left  { top: 44px; left: 0px; }
        #btn-right { top: 44px; right: 0px; }
        .dpad-center {
            position: absolute;
            top: 44px;
            left: 44px;
            width: 42px;
            height: 42px;
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid rgba(0, 210, 211, 0.3);
            border-radius: 6px;
        }

        /* TOMBOL AKSI UTAMA HP */
        .action-btn { width: 48px; height: 48px; font-size: 15px; }
        #btn-attack { right: 20px; bottom: 20px; width: 68px; height: 68px; background: rgba(231, 76, 60, 0.5); border-color: rgba(231, 76, 60, 0.95); font-size: 22px; }
        #btn-weapon { right: 100px; bottom: 20px; background: rgba(241, 196, 15, 0.4); border-color: rgba(241, 196, 15, 0.85); }
        #btn-shield { right: 20px; bottom: 100px; background: rgba(0, 255, 204, 0.4); border-color: rgba(0, 255, 204, 0.85); }
        #btn-awaken { right: 88px; bottom: 82px; background: rgba(155, 89, 182, 0.6); border-color: #9b59b6; color: #f1c40f; }

        .skill-bar-touch {
            position: absolute;
            right: 15px;
            bottom: 160px;
            display: flex;
            gap: 6px;
            pointer-events: auto;
        }
        .skill-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            background: rgba(10, 10, 20, 0.75);
            border: 1.5px solid #00d2d3;
            color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 210, 211, 0.3);
        }

        /* Tombol Pause */
        #btn-pause {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            pointer-events: auto;
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid #00d2d3;
            color: #00ffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(0, 210, 211, 0.5);
        }
        #btn-pause:active { background: rgba(0, 210, 211, 0.6); }
    </style>
</head>
<body>

 <div id="game-container">
     <button id="btn-pause">⏸️ PAUSE</button>

     <canvas id="gameCanvas" width="900" height="500" style="width: 100vw; height: 100vh; object-fit: contain; display: block; margin: auto; background: #000;"></canvas>

     <div id="virtual-gamepad">
         <div class="dpad-cross">
             <div class="touch-btn dpad-btn" id="btn-up">▲</div>
             <div class="touch-btn dpad-btn" id="btn-left">◀</div>
             <div class="dpad-center"></div>
             <div class="touch-btn dpad-btn" id="btn-right">▶</div>
             <div class="touch-btn dpad-btn" id="btn-down">▼</div>
         </div>

         <div class="touch-btn action-btn" id="btn-attack">⚔️</div>
         <div class="touch-btn action-btn" id="btn-weapon">🔄</div>
         <div class="touch-btn action-btn" id="btn-shield">🛡️</div>
         <div class="touch-btn action-btn" id="btn-awaken">🔥</div>

         <div class="skill-bar-touch">
             <div class="touch-btn skill-btn" id="btn-s1">S1</div>
             <div class="touch-btn skill-btn" id="btn-s2">S2</div>
             <div class="touch-btn skill-btn" id="btn-s3">S3</div>
             <div class="touch-btn skill-btn" id="btn-s4">S4</div>
             <div class="touch-btn skill-btn" id="btn-s5">S5</div>
         </div>
     </div>
 </div>

 <script src="menu.js"></script>
 <script src="game.js"></script>

 <script>
 (() => {
     let isInternalGamepadInput = false;

     window.addEventListener('keydown', (e) => {
         if (!isInternalGamepadInput) {
             e.stopImmediatePropagation();
             e.preventDefault();
         }
     }, true);

     window.addEventListener('keyup', (e) => {
         if (!isInternalGamepadInput) {
             e.stopImmediatePropagation();
             e.preventDefault();
         }
     }, true);

     // PENANGANAN LANGSUNG TOMBOL PAUSE
     const pauseBtn = document.getElementById('btn-pause');
     if (pauseBtn) {
         const togglePause = (e) => {
             e.preventDefault();
             e.stopPropagation();
             if (window.gameState === 'GAME') {
                 window.gameState = 'PAUSED';
                 if (typeof pauseSelectedOption !== 'undefined') pauseSelectedOption = 0;
             } else if (window.gameState === 'PAUSED') {
                 window.gameState = 'GAME';
             }
         };
         pauseBtn.addEventListener('click', togglePause);
         pauseBtn.addEventListener('touchstart', togglePause, { passive: false });
     }

     function sendGamepadKey(key, code, type) {
         isInternalGamepadInput = true;
         window.dispatchEvent(new KeyboardEvent(type, {
             key: key, code: code, keyCode: key.charCodeAt(0) || 0, bubbles: true, cancelable: true
         }));
         isInternalGamepadInput = false;
     }

     function sendGamepadAttack(type) {
         isInternalGamepadInput = true;
         const canvas = document.getElementById('gameCanvas');
         if (canvas) canvas.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button: 0 }));
         isInternalGamepadInput = false;
     }

     const mapping = {
         'btn-up': { key: 'ArrowUp', code: 'ArrowUp' },
         'btn-down': { key: 'ArrowDown', code: 'ArrowDown' },
         'btn-left': { key: 'ArrowLeft', code: 'ArrowLeft' },
         'btn-right': { key: 'ArrowRight', code: 'ArrowRight' },
         'btn-weapon': { key: 'q', code: 'KeyQ' },
         'btn-shield': { key: 'Shift', code: 'ShiftLeft' },
         'btn-awaken': { key: 'e', code: 'KeyE' },
         'btn-s1': { key: '1', code: 'Digit1' },
         'btn-s2': { key: '2', code: 'Digit2' },
         'btn-s3': { key: '3', code: 'Digit3' },
         'btn-s4': { key: '4', code: 'Digit4' },
         'btn-s5': { key: '5', code: 'Digit5' }
     };

     Object.keys(mapping).forEach(id => {
         const el = document.getElementById(id);
         if (!el) return;
         const data = mapping[id];

         const start = (e) => {
             e.preventDefault();
             el.classList.add('pressed');
             sendGamepadKey(data.key, data.code, 'keydown');
         };
         const end = (e) => {
             e.preventDefault();
             el.classList.remove('pressed');
             sendGamepadKey(data.key, data.code, 'keyup');
         };

         el.addEventListener('touchstart', start, { passive: false });
         el.addEventListener('touchend', end, { passive: false });
         el.addEventListener('mousedown', start);
         el.addEventListener('mouseup', end);
     });

     const atkBtn = document.getElementById('btn-attack');
     if (atkBtn) {
         const startAtk = (e) => {
             e.preventDefault();
             atkBtn.classList.add('pressed');
             if (window.gameState !== 'GAME') {
                 sendGamepadKey('Enter', 'Enter', 'keydown');
             } else {
                 sendGamepadAttack('mousedown');
             }
         };
         const endAtk = (e) => {
             e.preventDefault();
             atkBtn.classList.remove('pressed');
             if (window.gameState !== 'GAME') {
                 sendGamepadKey('Enter', 'Enter', 'keyup');
             } else {
                 sendGamepadAttack('mouseup');
             }
         };
         atkBtn.addEventListener('touchstart', startAtk, { passive: false });
         atkBtn.addEventListener('touchend', endAtk, { passive: false });
         atkBtn.addEventListener('mousedown', startAtk);
         atkBtn.addEventListener('mouseup', endAtk);
     }
 })();
 </script>
</body>
</html>
